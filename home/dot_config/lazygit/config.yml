git:
  diffRenderers:
    # theme lives in [delta] in gitconfig. lazygit runs the pager in a pty sized to the diff pane,
    # so delta measures the width itself; don't pass {{columnWidth}}, that's half the pane
    # (width/2 - 6, meant for per-column tools) and delta's --width wants the whole thing.
    # delta only wraps long lines (under the gutter) in side-by-side; unified never wraps, so
    # lazygit wraps it and the overflow lands at column 0. | cycles to unified anyway
    - command: delta --paging=never --side-by-side
      name: delta side-by-side
    - command: delta --paging=never
      name: delta unified
customCommands:
  # branches panel: select a branch, ctrl+s, pick the base. every commit the base doesn't have becomes
  # one pr in a github stacked pr (oldest at the bottom); run it again after more commits and the
  # same prs update with new ones added on top. a single commit is a plain pr with auto-merge.
  # stacks can't auto-merge: once checks are green, ctrl+g merges the whole stack in one go.
  # script: ~/.config/lazygit/stack-pr.sh (needs: gh extension install github/gh-stack)
  - key: "<ctrl+s>"
    context: "localBranches"
    description: "ship branch: stacked pr, one pr per commit"
    prompts:
      - type: "menu"
        key: "Base"
        title: "stack {{.SelectedLocalBranch.Name}} onto"
        options:
          - value: "master"
          - value: "test"
    command: '"$HOME/.config/lazygit/stack-pr.sh" submit {{.SelectedLocalBranch.Name | quote}} {{.Form.Base | quote}}'
    output: terminal

  - key: "<ctrl+g>"
    context: "localBranches"
    description: "merge branch's stacked pr (whole stack, once green)"
    prompts:
      - type: "menu"
        key: "Base"
        title: "merge {{.SelectedLocalBranch.Name}}'s stack into"
        options:
          - value: "master"
          - value: "test"
    command: '"$HOME/.config/lazygit/stack-pr.sh" merge {{.SelectedLocalBranch.Name | quote}} {{.Form.Base | quote}}'
    output: terminal
