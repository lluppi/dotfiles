git:
  diffRenderers:
    # theme lives in [delta] in gitconfig. lazygit runs the pager in a pty sized to the diff pane,
    # so delta measures the width itself; don't pass {{columnWidth}}, that's half the pane
    # (width/2 - 6, meant for per-column tools) and delta's --width wants the whole thing.
    # delta only wraps long lines (under the gutter) in side-by-side; unified never wraps, so
    # lazygit wraps it and the overflow lands at column 0. | cycles to unified anyway
    - command: delta --paging=never --side-by-side
      name: delta side-by-side
    - command: delta --paging=never
      name: delta unified
customCommands:
  # select a branch in the branches panel, ctrl+s, pick the base: pushes the branch,
  # opens the pr (or reuses the open one) and arms auto-merge, so it lands once ci is green
  - key: "<c-s>"
    context: "localBranches"
    description: "ship branch: pr + auto-merge"
    prompts:
      - type: "menu"
        key: "Base"
        title: "pr {{.SelectedLocalBranch.Name}} into"
        options:
          - value: "test"
          - value: "master"
    command: >-
      git push origin {{.SelectedLocalBranch.Name}} &&
      (gh pr create --base {{.Form.Base}} --head {{.SelectedLocalBranch.Name}} --fill ||
      echo "pr already open, re-arming auto-merge") &&
      gh pr merge $(gh pr list --base {{.Form.Base}} --head {{.SelectedLocalBranch.Name}} --json number --jq '.[0].number') --auto --merge
    output: terminal
