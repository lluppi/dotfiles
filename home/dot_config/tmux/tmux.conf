# tmux mostly hosts long-lived pi sessions (pnew / pgo / pls in zshrc); ghostty does day-to-day splits.
# prefix stays ctrl+b: ctrl+a is ghostty's leader and zsh's beginning-of-line.
# pane keys copy ghostty's ctrl+a bindings so the muscle memory carries over.

# terminal: true colour, undercurls and extended keys through ghostty
# macos' system ncurses has no tmux-256color entry, so fall back there instead of breaking less/htop
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"' 'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB:extkeys:usstyle:clipboard"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g allow-passthrough on

# nvim: no esc lag, focus events for autoread
set -sg escape-time 0
set -g focus-events on

set -g mouse on
set -g history-limit 100000
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000

# panes: h split down, v split right, x equalize, w close, arrows move, . , resize
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x select-layout tiled
bind w kill-pane
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind -r . resize-pane -R 5
bind -r , resize-pane -L 5
bind c new-window -c "#{pane_current_path}"
bind s choose-tree -Zs
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# copy mode: vi keys, v select, y yank (osc52 hands it to the system clipboard)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# kanagawa wave, matches ghostty
set -g status-position bottom
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left "#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#ff9e3b]prefix ,}#[fg=#727169]%H:%M "
setw -g window-status-format "#[fg=#727169] #I #W "
setw -g window-status-current-format "#[bg=#2a2a37,fg=#98bb6c,bold] #I #W "
set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#7e9cd8"
set -g message-style "bg=#2a2a37,fg=#dcd7ba"
set -g mode-style "bg=#2d4f67,fg=#dcd7ba"
